name: release

# Publica o FTPZilla.exe quando uma tag vX.Y.Z e enviada.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Porta de entrada - tudo compila e importa
        run: |
          python -m compileall -q ftpzilla app.py
          python -c "import ftpzilla, ftpzilla.remotes, ftpzilla.ui.janela"

      - name: Bateria de testes
        # os servidores de teste sobem no proprio processo, entao nao ha
        # dependencia de rede externa
        run: python tests\rodar_todos.py

      - name: Gerar o executavel
        run: .\build.bat

      - name: Notas da versao
        shell: bash
        run: |
          anterior=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "## O que mudou" > NOTAS.md
          if [ -n "$anterior" ]; then
            git log --pretty='- %s' "$anterior"..HEAD >> NOTAS.md
          else
            git log --pretty='- %s' >> NOTAS.md
          fi

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FTPZilla.exe
          body_path: NOTAS.md
